<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unit 8: Options Calculator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #5d2f91; text-decoration: none; font-weight: bold; }
        .flex-row { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { flex: 1 1 300px; border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fafafa; }
        h2 { color: #5d2f91; border-bottom: 2px solid #5d2f91; margin-top: 0; }
        h3 { color: #5d2f91; margin-top: 0; }
        label { font-size: 0.9em; font-weight: bold; color: #444; margin-top: 8px; display: block; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #5d2f91; color: white; border: none; margin-top: 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { background: #4a2574; }
        
        .result-box { margin-top:20px; padding:15px; background:#eee; border-radius: 5px; display: none; border-left: 5px solid #5d2f91; }
        .profit-pos { color: green; font-weight: bold; }
        .profit-neg { color: red; font-weight: bold; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Dashboard</a>
        <h1>Options Analysis</h1>
        
        <div class="flex-row">
            <div class="card">
                <h3>Single Option</h3>
                <label>Type:</label>
                <select id="s_type">
                    <option value="call">Call</option>
                    <option value="put">Put</option>
                </select>
                
                <label>Role:</label>
                <select id="s_role">
                    <option value="hold">Holder (Buyer)</option>
                    <option value="write">Writer (Seller)</option>
                </select>
                
                <label>Exercise Price (X):</label>
                <input type="number" step="0.01" id="s_x">
                
                <label>Premium:</label>
                <input type="number" step="0.01" id="s_premium">
                
                <label>Stock Price at Expiry (ST):</label>
                <input type="number" step="0.01" id="s_st">
                
                <button onclick="runSingle()">Calculate Single</button>
            </div>

            <div class="card">
                <h3>Straddle Strategy</h3>
                <label>Exercise Price (X):</label>
                <input type="number" step="0.01" id="str_x">
                
                <label>Call Premium:</label>
                <input type="number" step="0.01" id="str_cp">
                
                <label>Put Premium:</label>
                <input type="number" step="0.01" id="str_pp">
                
                <label>Stock Price at Expiry (ST):</label>
                <input type="number" step="0.01" id="str_st">
                
                <button onclick="runStraddle()">Calculate Straddle</button>
            </div>
        </div>

        <div id="main-res" class="result-box">
            <h3 id="res-title">Result</h3>
            <div class="res-row"><span>Role:</span> <strong id="res-role"></strong></div>
            <div class="res-row"><span>Profit:</span> <span id="res-profit"></span></div>
            <div class="res-row"><span>Break Even:</span> <span id="res-be"></span></div>
            <div class="res-row" id="row-note"><span>Note:</span> <span id="res-note"></span></div>
        </div>
    </div>

    <script src="js/unit8.js"></script>
    <script>
        // Helper formatter
        const money = (num) => "$" + num.toFixed(2);

        function showRes(data) {
            const box = document.getElementById('main-res');
            box.style.display = 'block';
            
            document.getElementById('res-role').innerText = data.role;
            
            const pSpan = document.getElementById('res-profit');
            pSpan.innerText = money(data.profit);
            pSpan.className = data.profit >= 0 ? 'profit-pos' : 'profit-neg';

            // Straddle returns be_upper and be_lower, single returns breakeven
            if (data.breakeven !== undefined) {
                document.getElementById('res-be').innerText = money(data.breakeven);
            } else if (data.be_upper) {
                document.getElementById('res-be').innerText = `${money(data.be_lower)} / ${money(data.be_upper)}`;
            }

            if (data.note) {
                document.getElementById('row-note').style.display = 'flex';
                document.getElementById('res-note').innerText = data.note;
            } else {
                document.getElementById('row-note').style.display = 'none';
            }
            
            // Smooth scroll to result
            box.scrollIntoView({ behavior: 'smooth' });
        }

        function runSingle() {
            const type = document.getElementById('s_type').value;
            const role = document.getElementById('s_role').value;
            const x = parseFloat(document.getElementById('s_x').value);
            const prem = parseFloat(document.getElementById('s_premium').value);
            const st = parseFloat(document.getElementById('s_st').value);

            const isCall = (type === 'call');
            const isHolder = (role === 'hold');

            const res = Unit8.calculateOptionAll(st, x, prem, isCall, isHolder);
            showRes(res);
        }

        function runStraddle() {
            const x = parseFloat(document.getElementById('str_x').value);
            const cp = parseFloat(document.getElementById('str_cp').value);
            const pp = parseFloat(document.getElementById('str_pp').value);
            const st = parseFloat(document.getElementById('str_st').value);

            // Unit8.calculateStraddle was defined in our Python logic 
            // We need to ensure we implemented it in JS in the previous step.
            // If not, here is the quick inline implementation for safety:
            
            // Logic replication:
            const totalPrem = cp + pp;
            const callPayoff = Math.max(0, st - x);
            const putPayoff = Math.max(0, x - st);
            const totalIntrinsic = callPayoff + putPayoff;
            
            // Assuming Holder for this UI
            const profit = totalIntrinsic - totalPrem;
            
            const res = {
                role: "Long Straddle (Holder)",
                profit: profit,
                be_upper: x + totalPrem,
                be_lower: x - totalPrem,
                note: `Total Cost: ${money(totalPrem)}`
            };
            
            showRes(res);
        }
    </script>
</body>
</html>
