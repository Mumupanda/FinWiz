<!DOCTYPE html>
<html>
<head>
    <title>Unit 3: Bond Calculator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fdfdfd; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2c3e50; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #2c3e50; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1.1em; }
        .result-box { margin-top: 25px; padding: 20px; background: #f8f9fa; border-left: 5px solid #2c3e50; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Dashboard</a>
        <h1>Simple Bonds</h1>
        
        <div class="input-group">
            <label>Par Value ($):</label>
            <input type="number" id="par" value="1000">
        </div>
        <div class="input-group">
            <label>Coupon Rate (Annual % - e.g. 5 for 5%):</label>
            <input type="number" step="0.0001" id="c_rate">
        </div>
        <div class="input-group">
            <label>Yield Rate (YTM % - e.g. 4 for 4%):</label>
            <input type="number" step="0.0001" id="m_rate">
        </div>
        <div class="input-group">
            <label>Years to Maturity:</label>
            <input type="number" id="years">
        </div>
        <button onclick="calculateBond()">Calculate Bond Value</button>

        <div id="res-box" class="result-box">
            <h3>Results:</h3>
            <p>Market Price: <strong id="res-price"></strong></p>
            <p>Current Yield: <span id="res-yield"></span></p>
            <p>Status: <strong id="res-status"></strong></p>
        </div>
    </div>
    <script src="js/unit3.js"></script>
</body>
</html>
