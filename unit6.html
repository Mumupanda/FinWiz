<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unit 6: Stock Picking Theories</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; padding: 40px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2c3e50; text-decoration: none; font-weight: bold; }
        .input-section { margin-bottom: 25px; padding: 15px; border-left: 5px solid #2c3e50; background: #fdfdfd; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #34495e; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1em; transition: background 0.3s; }
        button:hover { background: #34495e; }
        .verdict-box { margin-top: 30px; padding: 20px; border-radius: 8px; background: #eef2f7; display: none; }
        .verdict-header { margin: 0 0 15px 0; color: #2c3e50; }
        ul { padding-left: 20px; color: #555; }
        li { margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Dashboard</a>
        <h1>Buffett Value Analysis</h1>
        
        <div class="input-section">
            <h3>Financial Quality</h3>
            <label>Return on Equity (Decimal, e.g. 0.18)</label>
            <input type="number" step="0.01" id="roe">
            
            <label>Net Profit Margin (Decimal, e.g. 0.12)</label>
            <input type="number" step="0.01" id="margin">
            
            <label>Debt-to-Equity Ratio</label>
            <input type="number" step="0.01" id="de_ratio">
        </div>
        
        <div class="input-section">
            <h3>Growth Inputs</h3>
            <label>Stock Price ($)</label>
            <input type="number" step="0.01" id="price">
            
            <label>Earnings Per Share (EPS)</label>
            <input type="number" step="0.01" id="eps">
            
            <label>Projected Growth Rate (Percentage, e.g. 8.5)</label>
            <input type="number" step="0.1" id="growth_rate">
        </div>
        
        <button onclick="runBuffettCheck()">Evaluate Strategy</button>

        <div id="result-box" class="verdict-box">
            <h2 id="score-header" class="verdict-header"></h2>
            <h3 id="verdict-text" style="color:#2980b9;"></h3>
            <ul id="details-list"></ul>
        </div>
    </div>

    <script src="js/unit6.js"></script>
    <script>
        function runBuffettCheck() {
            const data = {
                roe: parseFloat(document.getElementById('roe').value),
                margin: parseFloat(document.getElementById('margin').value),
                de_ratio: parseFloat(document.getElementById('de_ratio').value),
                price: parseFloat(document.getElementById('price').value),
                eps: parseFloat(document.getElementById('eps').value),
                growth_rate: parseFloat(document.getElementById('growth_rate').value)
            };

            const result = Unit6.evaluate(data);
            
            const box = document.getElementById('result-box');
            box.style.display = 'block';
            
            document.getElementById('score-header').innerText = `Score: ${result.score} / 5`;
            document.getElementById('verdict-text').innerText = result.verdict;
            
            const list = document.getElementById('details-list');
            list.innerHTML = '';
            result.details.forEach(line => {
                const li = document.createElement('li');
                li.innerText = line;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
