<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unit 1: Time Value of Money</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: #f4f7f6; }
        h1 { color: #2c3e50; text-align: center; }
        .container { max-width: 1000px; margin: auto; }
        .calc-box { background: white; border: 1px solid #ccc; padding: 20px; margin-bottom: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #007bff; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.9em; }
        input, select { margin-top: 5px; width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .result-container { border: 2px solid #28a745; background-color: #f0fff0; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; display: none; }
        .result { font-weight: bold; font-size: 1.2em; color: #28a745; }
        .nav-link { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Time Value of Money</h1>
    <a href="index.html" class="nav-link">← Back to Dashboard</a>

    <div id="result-box" class="result-container" style="display:none;">
        <h3>Calculation Result:</h3>
        <p id="main-result" class="result"></p>
    </div>

    <div class="grid">
        <div class="calc-box">
            <h2>Simple Interest (FV)</h2>
            <label>Present Value (PV) ($):</label>
            <input type="number" step="0.01" id="simple_pv">
            <label>Annual Interest Rate (%):</label>
            <input type="number" step="0.01" id="simple_rate">
            <label>Time Period Type:</label>
            <select id="simple_time_type">
                <option value="years">Years</option>
                <option value="days">Days</option>
            </select>
            <input type="number" step="1" id="simple_time_val" placeholder="Number of units">
            <button onclick="calculateSimpleFV()">Calculate Simple FV</button>
        </div>

        <div class="calc-box">
            <h2>Compound Interest</h2>
            <select id="comp_type" style="font-weight: bold; margin-bottom: 10px;">
                <option value="fv">Find Future Value (FV)</option>
                <option value="pv">Find Present Value (PV)</option>
            </select>
            <label>Amount ($):</label>
            <input type="number" step="0.01" id="comp_amount">
            <label>Nominal Annual Rate (%):</label>
            <input type="number" step="0.01" id="comp_rate">
            <label>Compounding Frequency:</label>
            <select id="comp_freq">
                <option value="1">Annually (1)</option>
                <option value="2">Semi-Annually (2)</option>
                <option value="4">Quarterly (4)</option>
                <option value="12">Monthly (12)</option>
                <option value="365">Daily (365)</option>
            </select>
            <label>Years:</label>
            <input type="number" step="0.01" id="comp_years">
            <button onclick="calculateCompound()">Calculate Compound</button>
        </div>

        <div class="calc-box">
            <h2>Perpetuities (Constant/Growing)</h2>
            <label>Payment (PMT) ($):</label>
            <input type="number" step="0.01" id="perp_pmt">
            <label>Nominal Annual Rate (%):</label>
            <input type="number" step="0.01" id="perp_rate">
            <label>Compounding Frequency:</label>
            <select id="perp_freq">
                <option value="1">Annually</option>
                <option value="2">Semi-Annually</option>
                <option value="12">Monthly</option>
            </select>
            <label>Periodic Growth Rate (%) (0 for constant):</label>
            <input type="number" step="0.01" id="perp_growth" value="0">
            <button onclick="calculatePerpetuity()">Calculate Perpetuity PV</button>
        </div>

        <div class="calc-box">
            <h2>Growing Annuities (PV)</h2>
            <label>First Payment (PMT) ($):</label>
            <input type="number" step="0.01" id="ga_pmt">
            <label>Nominal Annual Rate (%):</label>
            <input type="number" step="0.01" id="ga_rate">
            <label>Periodic Growth Rate (%):</label>
            <input type="number" step="0.01" id="ga_growth">
            <label>Compounding Frequency:</label>
            <select id="ga_freq">
                <option value="1">Annually</option>
                <option value="12">Monthly</option>
            </select>
            <label>Total Years:</label>
            <input type="number" step="1" id="ga_years">
            <button onclick="calculateGrowingAnnuity()">Calculate Growing PV</button>
        </div>
    </div>

    <div class="calc-box">
        <h2>Standard Annuity (FV & PV)</h2>
        <div class="grid">
            <div>
                <label>Action:</label>
                <select id="ann_type">
                    <option value="fv">Calculate Future Value</option>
                    <option value="pv">Calculate Present Value</option>
                </select>
                <label>Periodic Payment ($):</label>
                <input type="number" step="0.01" id="ann_pmt">
                <label>Nominal Annual Rate (%):</label>
                <input type="number" step="0.01" id="ann_rate">
            </div>
            <div>
                <label>Freq (Pymts per Year):</label>
                <select id="ann_freq">
                    <option value="1">1 (Annual)</option>
                    <option value="12">12 (Monthly)</option>
                </select>
                <label>Years:</label>
                <input type="number" step="0.01" id="ann_years">
                <label>Timing:</label>
                <select id="ann_timing">
                    <option value="ordinary">End (Ordinary)</option>
                    <option value="due">Beginning (Due)</option>
                </select>
            </div>
        </div>
        <button onclick="calculateAnnuity()">Calculate Standard Annuity</button>
    </div>
</div>

<script>
    // Simple helper to show the result box
    function displayResult(msg) {
        const container = document.getElementById('result-box');
        const text = document.getElementById('main-result');
        container.style.display = 'block';
        text.innerText = msg;
        // Scroll to top to see result
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
<script src="js/unit1.js"></script>

</body>
</html>
