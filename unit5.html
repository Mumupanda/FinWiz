<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unit 5: Financial Statement Analysis</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: var(--primary); text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        h3 { color: var(--primary); margin-top: 25px; border-left: 4px solid var(--accent); padding-left: 10px; background: #f9f9f9; padding: 10px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 30px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 4px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1em; margin-top: 30px; font-weight: bold; transition: background 0.3s; }
        .btn:hover { background: #34495e; }

        .results-container { margin-top: 40px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: var(--primary); }
        .status-Good { color: #27ae60; font-weight: bold; }
        .status-Bad { color: #e74c3c; font-weight: bold; }
        .back-link { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    <h1>Financial Ratio Analysis</h1>
    <p style="text-align: center;">Enter company data to evaluate performance against industry benchmarks.</p>

    <h3>1. Market & Per-Share Data</h3>
    <div class="grid">
        <div class="input-group">
            <label>Current Stock Price ($):</label>
            <input type="number" step="0.01" id="price" required>
        </div>
        <div class="input-group">
            <label>Earnings Per Share (EPS):</label>
            <input type="number" step="0.01" id="eps" required>
        </div>
        <div class="input-group">
            <label>Book Value Per Share (BVPS):</label>
            <input type="number" step="0.01" id="bvps" required>
        </div>
        <div class="input-group">
            <label>Cash Flow Per Share (OCFPS):</label>
            <input type="number" step="0.01" id="ocfps" required>
        </div>
        <div class="input-group">
            <label>Shares Outstanding (Millions):</label>
            <input type="number" step="0.01" id="shares_os" required>
        </div>
        <div class="input-group">
            <label>Expected Growth Rate (decimal, e.g. 0.05):</label>
            <input type="number" step="0.0001" id="growth" required>
        </div>
    </div>

    <h3>2. Income Statement Items</h3>
    <div class="grid">
        <div class="input-group">
            <label>Total Sales (Revenue):</label>
            <input type="number" step="0.01" id="sales" required>
        </div>
        <div class="input-group">
            <label>Cost of Goods Sold (COGS):</label>
            <input type="number" step="0.01" id="cogs" required>
        </div>
        <div class="input-group">
            <label>EBIT (Operating Income):</label>
            <input type="number" step="0.01" id="ebit" required>
        </div>
        <div class="input-group">
            <label>Interest Expense:</label>
            <input type="number" step="0.01" id="int_exp" required>
        </div>
        <div class="input-group">
            <label>Net Income:</label>
            <input type="number" step="0.01" id="ni" required>
        </div>
    </div>

    <h3>3. Balance Sheet Items</h3>
    <div class="grid">
        <div class="input-group">
            <label>Current Assets:</label>
            <input type="number" step="0.01" id="current_assets" required>
        </div>
        <div class="input-group">
            <label>Current Liabilities:</label>
            <input type="number" step="0.01" id="current_liab" required>
        </div>
        <div class="input-group">
            <label>Total Assets:</label>
            <input type="number" step="0.01" id="assets" required>
        </div>
        <div class="input-group">
            <label>Total Equity:</label>
            <input type="number" step="0.01" id="equity" required>
        </div>
        <div class="input-group">
            <label>Long-Term Debt:</label>
            <input type="number" step="0.01" id="lt_debt" required>
        </div>
        <div class="input-group">
            <label>Accounts Receivable:</label>
            <input type="number" step="0.01" id="ar" required>
        </div>
        <div class="input-group">
            <label>Inventory:</label>
            <input type="number" step="0.01" id="inv" required>
        </div>
        <div class="input-group">
            <label>Number of Employees:</label>
            <input type="number" id="emps" required>
        </div>
    </div>

    <button onclick="runAnalysis()" class="btn">Analyze Financial Health</button>

    <div id="results-container" class="results-container">
        <h3>Analysis Results</h3>
        <table>
            <thead>
                <tr>
                    <th>Ratio Name</th>
                    <th>Calculated Value</th>
                    <th>Status / Benchmark</th>
                </tr>
            </thead>
            <tbody id="results-body">
                </tbody>
        </table>
    </div>
</div>

<script src="js/unit5.js"></script>
<script>
    function runAnalysis() {
        // Collect all inputs into a dictionary object
        const data = {};
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            data[input.id] = parseFloat(input.value) || 0;
        });

        // Calculate using logic file
        const results = Unit5.calculateRatios(data);
        
        // Render Table
        const tbody = document.getElementById('results-body');
        tbody.innerHTML = ''; // Clear previous
        
        // Order of keys matter? Not strictly, but let's iterate object
        for (const [key, obj] of Object.entries(results)) {
            const row = document.createElement('tr');
            
            // Format Value
            let displayVal = obj.val.toFixed(2);
            if (key.includes('Margin') || key.includes('Return') || key.includes('Growth')) {
                displayVal = (obj.val * 100).toFixed(2) + '%';
            }

            row.innerHTML = `
                <td>${key}</td>
                <td>${displayVal}</td>
                <td class="status-${obj.status}">${obj.status}</td>
            `;
            tbody.appendChild(row);
        }

        document.getElementById('results-container').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>
</body>
</html>
